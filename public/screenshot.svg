  </defs>

  <!-- Browser Window Wrapper -->
  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#f8fafc" />
  <rect x="0" y="0" width="1200" height="760" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Window Chrome Header -->
  <path d="M 0 16 Q 0 0 16 0 L 1184 0 Q 1200 0 1200 16 L 1200 42 L 0 42 Z" fill="#ffffff" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />

